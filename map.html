<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME | Interactive Map</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet (mapa gratuito, sin API key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            color: #111111;
            background: #ffffff;
        }

        .map-page {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ---------- PANEL LATERAL ---------- */

        .sidebar {
            width: 360px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            z-index: 1000;
        }

        .sidebar-top {
            padding: 16px 16px 12px;
            border-bottom: 1px solid #eef0f2;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            color: #ff4b12;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #f8f9fa;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .search-box:focus-within {
            border-color: #ff4b12;
            background: #ffffff;
        }

        .search-box input {
            width: 100%;
            padding: 12px 0;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: #111111;
        }

        .clear-btn {
            width: 44px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #f8f9fa;
            color: #555;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .clear-btn:hover { background: #e9ecef; }

        .chips {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            border-bottom: 1px solid #eef0f2;
            scrollbar-width: thin;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            border: 1px solid #e5e7eb;
            border-radius: 30px;
            background: #ffffff;
            color: #111111;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .chip:hover { border-color: #ff4b12; }

        .chip.active {
            background: #111426;
            border-color: #111426;
            color: #ffffff;
        }

        .count {
            padding: 12px 18px 8px;
            color: #6b7280;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .space-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 14px 20px;
        }

        .space-card {
            margin-bottom: 12px;
            padding: 15px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #ffffff;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .space-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .space-card.active {
            border-color: #ff4b12;
            box-shadow: 0 8px 20px rgba(255, 75, 18, 0.15);
        }

        .space-name {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
        }

        .space-name .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .space-address {
            margin: 6px 0 6px 19px;
            color: #6b7280;
            font-size: 11.5px;
        }

        .space-desc {
            margin-left: 19px;
            color: #6b7280;
            font-size: 11.5px;
            line-height: 1.55;
        }

        .space-tags {
            display: flex;
            gap: 6px;
            margin: 10px 0 0 19px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 3px 9px;
            border-radius: 20px;
            background: #f1f3f5;
            color: #555;
            font-size: 10px;
            font-weight: 600;
        }

        .tag.main { color: #ffffff; }

        .empty {
            padding: 40px 10px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        /* ---------- MAPA ---------- */

        .map-wrap {
            position: relative;
            flex: 1;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-logo {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            color: #111111;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .map-logo svg { width: 24px; height: 24px; }

        /* Pines personalizados */

        .pin {
            width: 26px;
            height: 26px;
            border: 3px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease;
        }

        .pin.active {
            transform: rotate(-45deg) scale(1.3);
        }

        .leaflet-div-icon { background: transparent; border: none; }

        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
        }

        .popup-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .popup-addr { color: #6b7280; font-size: 12px; margin-bottom: 8px; }

        .popup-link {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: linear-gradient(90deg, #ff4b12, #ff7900);
            color: #ffffff !important;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        /* ---------- MÓVIL ---------- */

        @media (max-width: 800px) {
            .map-page { flex-direction: column-reverse; }

            .sidebar {
                width: 100%;
                height: 50vh;
                border-right: none;
                border-top: 1px solid #e5e7eb;
            }

            .map-wrap { height: 50vh; flex: none; }
        }
    </style>
</head>
<body>

<div class="map-page">

    <!-- PANEL LATERAL -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <a href="index.html#courts" class="back-link">← Back to PRIME</a>

            <div class="search-row">
                <label class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchInput" placeholder="Search a sports space...">
                </label>
                <button class="clear-btn" id="clearBtn" aria-label="Clear search">✕</button>
            </div>
        </div>

        <div class="chips" id="chips"></div>
        <p class="count" id="count"></p>
        <div class="space-list" id="spaceList"></div>
    </aside>

    <!-- MAPA -->
    <main class="map-wrap">
        <a href="index.html" class="map-logo">
            <svg viewBox="0 0 60 55" aria-hidden="true">
                <circle cx="43" cy="7" r="4" fill="currentColor"/>
                <path d="M38 14 L25 22 L10 36 L3 43 L8 47 L20 39 L31 32 L24 43 L13 51 L22 53 L37 44 L48 27 L39 23 L45 17 Z" fill="currentColor"/>
                <path d="M28 22 L41 17 L48 21 L36 28 Z" fill="currentColor"/>
            </svg>
            PRIME
        </a>
        <div id="map"></div>
    </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ===== COLORES POR CATEGORÍA =====
    const categoryColors = {
        "Football": "#16a34a",
        "Baseball": "#dc2626",
        "Multi-sport": "#2563eb",
        "Futsal / Indoor": "#f97316",
        "Fitness / Gym": "#7c3aed",
        "Swimming": "#0891b2"
    };

    // ===== LUGARES (edita aquí nombres y coordenadas) =====
    const spaces = [
        {
            id: 1,
            name: 'Estadio Agustín "Muquita" Sánchez',
            address: "Calle Matuna, Barrio Colón, La Chorrera",
            desc: 'Historic football stadium since 1963, known locally as "La Cancha de La Cocobola".',
            cat: "Football",
            extra: "~5,000",
            lat: 8.8806, lng: -79.7795
        },
        {
            id: 2,
            name: "Estadio Mariano Rivera",
            address: "La Chorrera, Panamá Oeste (under construction)",
            desc: "New baseball stadium and High Performance Baseball Center under construction in the district of La Chorrera.",
            cat: "Baseball",
            extra: "In progress",
            lat: 8.8745, lng: -79.7690
        },
        {
            id: 3,
            name: "Complejo Deportivo 28 de Noviembre",
            address: "Calle 21, Barrio Colón, La Chorrera",
            desc: "Renovated municipal sports complex featuring a synthetic football pitch, a recreational court and a grandstand.",
            cat: "Multi-sport",
            extra: "350 seated",
            lat: 8.8790, lng: -79.7830
        },
        {
            id: 4,
            name: "Complejo Deportivo Municipal de La Chorrera",
            address: "Calle 34 y 35 Sur, Barrio Balboa, La Chorrera",
            desc: "Municipal sports complex in Barrio Balboa, near the Club de Leones de La Chorrera. Hosts local leagues and events.",
            cat: "Multi-sport",
            extra: "Open-air",
            lat: 8.8735, lng: -79.7845
        },
        {
            id: 5,
            name: "Complejo Deportivo de La Feria de La Chorrera",
            address: "La Feria, La Chorrera",
            desc: "Indoor courts used for futsal, padel coaching sessions and community training.",
            cat: "Futsal / Indoor",
            extra: "Indoor",
            lat: 8.8850, lng: -79.7880
        },
        {
            id: 6,
            name: "La Chorrera Municipal Pool",
            address: "La Chorrera, Panamá Oeste",
            desc: "Public swimming pool with lanes available for lessons and free swimming by the hour.",
            cat: "Swimming",
            extra: "Open-air",
            lat: 8.8770, lng: -79.7770
        },
        {
            id: 7,
            name: "Gimnasio Municipal de La Chorrera",
            address: "Centro de La Chorrera",
            desc: "Fitness and training space for workouts, functional training and group classes.",
            cat: "Fitness / Gym",
            extra: "Indoor",
            lat: 8.8825, lng: -79.7860
        }
    ];

    // ===== MAPA =====
    const map = L.map("map", { zoomControl: false }).setView([8.8795, -79.7810], 14);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19,
        subdomains: "abcd",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    // ===== ESTADO =====
    let activeCat = null;
    let query = "";
    let activeId = null;
    const markers = {};

    const listEl = document.getElementById("spaceList");
    const chipsEl = document.getElementById("chips");
    const countEl = document.getElementById("count");
    const searchInput = document.getElementById("searchInput");

    function makePin(color, active) {
        return L.divIcon({
            html: '<div class="pin' + (active ? " active" : "") + '" style="background:' + color + '"></div>',
            className: "",
            iconSize: [26, 26],
            iconAnchor: [13, 26],
            popupAnchor: [0, -26]
        });
    }

    function popupHtml(s) {
        const url = "https://www.google.com/maps/dir/?api=1&destination=" + s.lat + "," + s.lng;
        return '<div class="popup-title">' + s.name + '</div>' +
               '<div class="popup-addr">' + s.address + '</div>' +
               '<a class="popup-link" href="' + url + '" target="_blank" rel="noopener">Get directions</a>';
    }

    // Crear marcadores una sola vez
    spaces.forEach(s => {
        const marker = L.marker([s.lat, s.lng], { icon: makePin(categoryColors[s.cat], false) });
        marker.bindPopup(popupHtml(s));
        marker.on("click", () => selectSpace(s.id, false));
        markers[s.id] = marker;
    });

    function getFiltered() {
        const q = query.toLowerCase();
        return spaces.filter(s => {
            const matchCat = !activeCat || s.cat === activeCat;
            const matchText = !q || (s.name + " " + s.address + " " + s.cat).toLowerCase().includes(q);
            return matchCat && matchText;
        });
    }

    function render() {
        const filtered = getFiltered();

        // Lista
        listEl.innerHTML = "";
        if (filtered.length === 0) {
            listEl.innerHTML = '<p class="empty">No spaces found.</p>';
        }

        filtered.forEach(s => {
            const color = categoryColors[s.cat];
            const card = document.createElement("div");
            card.className = "space-card" + (s.id === activeId ? " active" : "");
            card.dataset.id = s.id;
            card.innerHTML =
                '<div class="space-name"><span class="dot" style="background:' + color + '"></span>' + s.name + '</div>' +
                '<p class="space-address">📍 ' + s.address + '</p>' +
                '<p class="space-desc">' + s.desc + '</p>' +
                '<div class="space-tags">' +
                    '<span class="tag main" style="background:' + color + '">' + s.cat + '</span>' +
                    '<span class="tag">' + s.extra + '</span>' +
                '</div>';
            card.addEventListener("click", () => selectSpace(s.id, true));
            listEl.appendChild(card);
        });

        countEl.textContent = filtered.length + (filtered.length === 1 ? " SPACE" : " SPACES");

        // Marcadores
        spaces.forEach(s => {
            const visible = filtered.some(f => f.id === s.id);
            if (visible && !map.hasLayer(markers[s.id])) markers[s.id].addTo(map);
            if (!visible && map.hasLayer(markers[s.id])) map.removeLayer(markers[s.id]);
        });
    }

    function renderChips() {
        chipsEl.innerHTML = "";

        const all = document.createElement("button");
        all.className = "chip" + (activeCat === null ? " active" : "");
        all.textContent = "All";
        all.addEventListener("click", () => { activeCat = null; renderChips(); render(); fitToResults(); });
        chipsEl.appendChild(all);

        Object.keys(categoryColors).forEach(cat => {
            const chip = document.createElement("button");
            chip.className = "chip" + (activeCat === cat ? " active" : "");
            chip.innerHTML = '<span class="dot" style="background:' + categoryColors[cat] + '"></span>' + cat;
            chip.addEventListener("click", () => {
                activeCat = (activeCat === cat) ? null : cat;
                renderChips();
                render();
                fitToResults();
            });
            chipsEl.appendChild(chip);
        });
    }

    function selectSpace(id, fly) {
        const s = spaces.find(x => x.id === id);
        if (!s) return;

        // Quitar énfasis del anterior
        if (activeId && markers[activeId]) {
            const prev = spaces.find(x => x.id === activeId);
            markers[activeId].setIcon(makePin(categoryColors[prev.cat], false));
        }

        activeId = id;
        markers[id].setIcon(makePin(categoryColors[s.cat], true));

        if (fly) {
            map.flyTo([s.lat, s.lng], 16, { duration: 0.8 });
            markers[id].openPopup();
        }

        render();

        const card = listEl.querySelector('[data-id="' + id + '"]');
        if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function fitToResults() {
        const filtered = getFiltered();
        if (filtered.length === 0) return;
        const bounds = L.latLngBounds(filtered.map(s => [s.lat, s.lng]));
        map.flyToBounds(bounds, { padding: [70, 70], maxZoom: 15, duration: 0.6 });
    }

    searchInput.addEventListener("input", () => {
        query = searchInput.value.trim();
        render();
        fitToResults();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
        searchInput.value = "";
        query = "";
        activeCat = null;
        renderChips();
        render();
        fitToResults();
    });

    // Inicio
    renderChips();
    render();
    map.fitBounds(L.latLngBounds(spaces.map(s => [s.lat, s.lng])), { padding: [70, 70] });
</script>

</body>
</html>
